services:
  ukombozi-db:
    image: postgres:15-alpine
    container_name: ukombozi-db
    environment:
      POSTGRES_USER: ${DB_USER:-ukombozi_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ukombozi_pass}
      POSTGRES_DB: ${DB_NAME:-ukombozi_tbms}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ukombozi-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ukombozi_user} -d ${DB_NAME:-ukombozi_tbms}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ukombozi-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ukombozi-backend
    depends_on:
      ukombozi-db:
        condition: service_healthy
      ukombozi-redis:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://${DB_USER:-ukombozi_user}:${DB_PASSWORD:-ukombozi_pass}@ukombozi-db:5432/${DB_NAME:-ukombozi_tbms}
      - REDIS_URL=redis://ukombozi-redis:6379
      - JWT_SECRET=${JWT_SECRET:-ukombozi-secret-key-2026}
      - NODE_ENV=production
      - PORT=5000
    ports:
      - "5000:5000"
    networks:
      - ukombozi-net
    restart: unless-stopped

  ukombozi-redis:
    image: redis:alpine
    container_name: ukombozi-redis
    ports:
      - "6379:6379"
    networks:
      - ukombozi-net
    restart: unless-stopped

  ukombozi-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ukombozi-frontend
    depends_on:
      - ukombozi-backend
    ports:
      - "3000:3000"
    networks:
      - ukombozi-net
    restart: unless-stopped

networks:
  ukombozi-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
